<div class="app-shell">
  <header class="app-shell__header">
    <a routerLink="/" class="app-shell__brand">JavaScript Fluency</a>
    <nav class="app-shell__nav" aria-label="Primary">
      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">
        Today's Revision
      </a>
      <a routerLink="/dashboard" routerLinkActive="is-active">Dashboard</a>
      <a routerLink="/mistakes" routerLinkActive="is-active">Mistakes</a>
      <a routerLink="/deep-dive" routerLinkActive="is-active">Deep Dive</a>
      <a routerLink="/setup" routerLinkActive="is-active">Access token</a>
      <button
        type="button"
        class="app-shell__theme-btn"
        (click)="toggleTheme()"
        [attr.aria-label]="'Current theme is ' + themeService.theme() + '. Click to switch theme.'"
        [title]="themeButtonLabel()"
      >
        <span class="app-shell__theme-icon" aria-hidden="true">{{ themeIcon() }}</span>
        <span class="app-shell__theme-text">{{ themeButtonLabel() }}</span>
      </button>
      @if (tokenStore.hasToken()) {
        <button type="button" class="app-shell__disconnect" (click)="disconnect()" title="Clear saved token and disconnect">
          Disconnect
        </button>
      }
    </nav>
  </header>
  <main class="app-shell__main">
    <router-outlet />
  </main>
</div>
