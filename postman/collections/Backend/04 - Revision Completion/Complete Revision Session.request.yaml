$kind: http-request
order: 1000
method: POST
url: '{{baseUrl}}/api/revision/complete'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "sessionId": "{{sessionId}}"
    }
description: |-
  Purpose: Explicitly finalize an OPEN revision session and apply scheduling.

  Method / path: POST /api/revision/complete

  Authentication: Required (collection bearer auth).

  Request body:
  - sessionId (string, required, non-empty)

  Validation / behavior (completeService):
  - Session must exist.
  - If already COMPLETED: returns stored scheduling audit + remapped topicStatus
    (idempotent; no second Topic/status/Deep Dive/Mistake write; mistakesCreated = 0).
  - If OPEN: every frozen question must have a SessionLog; otherwise 409
    "Session has unanswered questions".
  - Empty frozen set => 409 "Session has no frozen questions".

  Scheduling (verified):
  - G5 aggregation over stored correct + confidence (policyVersion phase3-g5-v1).
  - Outcomes: ADVANCE | REINFORCE | REINFORCE_AT_1 | RESET.
  - Next revision instant = Asia/Kolkata midnight on (completion Kolkata date + resultingIntervalDays).
  - Topic.intervalDays and Topic.nextRevisionDate update only on first successful complete.

  Phase 4 side effects (first successful complete only, same transaction):
  - Persists Topic.status via phase4-status-v1:
    ADVANCE -> GREEN; REINFORCE -> YELLOW; REINFORCE_AT_1 | RESET -> RED.
  - If the resulting status is RED: ensures a DeepDiveNote exists (create-if-missing;
    never overwrites an existing reason/notes). deepDiveEnsured is true only when a
    note was inserted by this finalize.
  - Auto-creates Mistake rows for final logs where correct = false, or correct = true
    with confidence DIDNT_UNDERSTAND. Deduped by sourceSessionLogId.
  - G5 schedule behavior is unchanged.

  Success 200:
  {
    "status": "ok",
    "sessionStatus": "COMPLETED",
    "scheduling": {
      "outcome": "ADVANCE|REINFORCE|REINFORCE_AT_1|RESET",
      "previousIntervalDays": number,
      "resultingIntervalDays": number,
      "resultingNextRevisionDate": "ISO-8601",
      "policyVersion": "phase3-g5-v1",
      "reason": string
    },
    "topicStatus": {
      "previous": "GREEN|YELLOW|RED",
      "current": "GREEN|YELLOW|RED",
      "policyVersion": "phase4-status-v1",
      "reason": string,
      "deepDiveEnsured": boolean
    },
    "mistakesCreated": number
  }

  Useful errors: 400 missing sessionId; 401 Unauthorized; 404 Session not found;
  409 unanswered / wrong status; 405; 500.

  WARNING: This mutates local Topic status/schedule and may create Deep Dive and
  Mistake rows. Use only against a development or disposable test database.
examples: './.resources/Complete Revision Session.resources/examples'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const json = pm.response.json();

      pm.test('Response is JSON with a status field', function () {
        pm.expect(json).to.be.an('object');
        pm.expect(json).to.have.property('status');
      });

      if (pm.response.code === 200) {
        pm.test('Success envelope matches CompleteSessionResponse', function () {
          pm.expect(json.status).to.eql('ok');
          pm.expect(json.sessionStatus).to.eql('COMPLETED');
          pm.expect(json.scheduling).to.be.an('object');
          pm.expect(json.scheduling).to.include.keys(
            'outcome',
            'previousIntervalDays',
            'resultingIntervalDays',
            'resultingNextRevisionDate',
            'policyVersion',
            'reason'
          );
          pm.expect(['ADVANCE', 'REINFORCE', 'REINFORCE_AT_1', 'RESET']).to.include(
            json.scheduling.outcome
          );
        });

        pm.test('Phase 4 status and side-effect fields are present', function () {
          pm.expect(json.topicStatus).to.be.an('object');
          pm.expect(json.topicStatus).to.include.keys(
            'previous',
            'current',
            'policyVersion',
            'reason',
            'deepDiveEnsured'
          );
          pm.expect(['GREEN', 'YELLOW', 'RED']).to.include(json.topicStatus.previous);
          pm.expect(['GREEN', 'YELLOW', 'RED']).to.include(json.topicStatus.current);
          pm.expect(json.topicStatus.policyVersion).to.eql('phase4-status-v1');
          pm.expect(json.topicStatus.deepDiveEnsured).to.be.a('boolean');
          pm.expect(json.mistakesCreated).to.be.a('number');
          pm.expect(json.mistakesCreated).to.be.at.least(0);
        });
      } else if (pm.response.code === 400 || pm.response.code === 401 || pm.response.code === 404 || pm.response.code === 409) {
        pm.test('Error envelope shape', function () {
          pm.expect(json.status).to.eql('error');
          pm.expect(json.message).to.be.a('string').and.not.empty;
        });
      }
