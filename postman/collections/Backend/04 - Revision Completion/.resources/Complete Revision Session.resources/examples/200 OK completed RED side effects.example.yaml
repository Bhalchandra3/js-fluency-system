$kind: http-example
name: 200 OK completed RED side effects
order: 1100
request:
  url: '{{baseUrl}}/api/revision/complete'
  method: POST
  body:
    type: json
    content: |-
      {
        "sessionId": "session-fixture-2"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "status": "ok",
        "sessionStatus": "COMPLETED",
        "scheduling": {
          "outcome": "RESET",
          "previousIntervalDays": 7,
          "resultingIntervalDays": 1,
          "resultingNextRevisionDate": "2026-10-25T18:30:00.000Z",
          "policyVersion": "phase3-g5-v1",
          "reason": "Reset to interval 1 because at least one answer was incorrect"
        },
        "topicStatus": {
          "previous": "YELLOW",
          "current": "RED",
          "policyVersion": "phase4-status-v1",
          "reason": "Status RED (was YELLOW) because session outcome RESET — unsuccessful session (incorrect answer(s))",
          "deepDiveEnsured": true
        },
        "mistakesCreated": 1
      }
