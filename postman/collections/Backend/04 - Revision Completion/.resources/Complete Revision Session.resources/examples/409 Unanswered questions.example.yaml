$kind: http-example
name: 409 Unanswered questions
order: 2000
request:
  url: '{{baseUrl}}/api/revision/complete'
  method: POST
  body:
    type: json
    content: |-
      {
        "sessionId": "session-fixture-1"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "status": "error",
        "message": "Session has unanswered questions"
      }
